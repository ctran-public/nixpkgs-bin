name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One runner per supported system in flake.nix
        os:
          - ubuntu-24.04 # x86_64-linux
          - ubuntu-24.04-arm # aarch64-linux
          - macos-15 # aarch64-darwin
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.3

      # Evaluates all outputs and runs `checks`: builds every package for this
      # system and runs its version test
      - name: Check flake
        run: nix flake check --print-build-logs

  # Fails when .github/workflows/actions.lock is out of sync with the workflows
  # or a locked pin no longer verifies upstream.
  verify-lockfile:
    name: verify actions lockfile
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify lockfile
        run: gh actions-lock --verify

  # Single required status check for the branch ruleset. Aggregates all jobs
  # so adding/removing a platform doesn't require editing the ruleset.
  required:
    name: ci/required
    if: always()
    needs: [check, verify-lockfile]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require all checks to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          LOCKFILE_RESULT: ${{ needs.verify-lockfile.result }}
        run: test "$CHECK_RESULT" = success && test "$LOCKFILE_RESULT" = success
