name: flakehub

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: flakehub
  cancel-in-progress: false

jobs:
  flakehub-publish:
    name: publish to flakehub
    # Only publish main pushes whose ci run succeeded, and only from the
    # upstream repository.
    if: >-
      github.repository == 'ctran-public/nixpkgs-bin'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: "ubuntu-24.04"
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: "DeterminateSystems/determinate-nix-action@v3.24.2"
      - uses: "DeterminateSystems/flakehub-push@v7"
        with:
          name: "ctran-public/nixpkgs-bin"
          rolling: true
          visibility: "public"
          include-output-paths: true
          rev: ${{ github.event.workflow_run.head_sha }}
