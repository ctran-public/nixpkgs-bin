name: Update mise

on:
  workflow_dispatch:
    inputs:
      version:
        description: "mise version (e.g. 2026.11.1). Leave empty for the latest release."
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-mise
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update flake.nix
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/update.sh ${{ inputs.version }}

      - name: Install Nix
        if: steps.update.outputs.updated == 'true'
        uses: cachix/install-nix-action@v31

      - name: Build and smoke-test
        if: steps.update.outputs.updated == 'true'
        run: |
          nix build .#mise --print-build-logs
          ./result/bin/mise --version

      - name: Create pull request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/mise
          delete-branch: true
          add-paths: flake.nix
          commit-message: "mise: update to ${{ steps.update.outputs.version }}"
          title: "mise: update to ${{ steps.update.outputs.version }}"
          body: |
            Updates mise to [v${{ steps.update.outputs.version }}](https://github.com/jdx/mise/releases/tag/v${{ steps.update.outputs.version }}).

            Hashes taken from the release's `SHASUMS256.txt`; the x86_64-linux build was verified in CI.
