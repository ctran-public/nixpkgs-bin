version: 2
updates:
  # Bumps the SHA-pinned actions in .github/workflows and their "# vX.Y.Z" comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Skip versions released in the last 7 days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Bumps the nixpkgs-unstable rev in flake.lock.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
