version: 2
updates:
  # Bumps the action version tags in .github/workflows. Commit SHAs are pinned
  # in .github/workflows/actions.lock, which is verified in CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Skip versions released in the last 7 days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Bumps the nixpkgs-unstable rev in flake.lock.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
